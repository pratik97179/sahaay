name: sahaay_design
description: Sahaay's design system - colours, type and drawn pieces.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.7

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    # The single typeface. A variable font: weights are set with the `wght`
    # axis as well as `FontWeight`.
    - family: Figtree
      fonts:
        - asset: fonts/figtree/Figtree-Variable.ttf
    # The rounded reading face. A variable font.
    - family: Nunito
      fonts:
        - asset: fonts/nunito/Nunito-Variable.ttf
    # Handwriting, for what the person writes themselves, such as the
    # sticky note. Latin only.
    - family: QEDavidReid
      fonts:
        - asset: fonts/qe_david_reid/QEDavidReid.ttf
